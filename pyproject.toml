[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blinkit-insight-engine"
version = "0.1.0"
description = "Review analyzer dashboard for Blinkit — batch NLP pipeline and validated insight views"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "sentence-transformers>=3.0",
    "chromadb>=0.5",
    "hdbscan>=0.8",
    "scikit-learn>=1.4",
    "groq>=0.9",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "streamlit>=1.32",
    "pysbd>=0.3",
    "bleach>=6.0",
    "rapidfuzz>=3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.8",
    "types-PyYAML>=6.0",
]
reddit = [
    "praw>=7.7",
]

[project.scripts]
blinkit = "common.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
packages = ["common", "ingestion", "pipeline", "models", "storage", "api"]
ignore_missing_imports = true
